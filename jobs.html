<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobs — CRM</title>
<meta name="theme-color" content="#1E4E54">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='47' fill='%231E4E54' stroke='%23E2915C' stroke-width='6'/%3E%3Cpath d='M56 18 26 56h24l-4 26 30-38H52l4-26Z' fill='%23EAF3F1'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
.page-content.wide { max-width: 1500px; }
.job-toolbar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.job-toolbar input { flex: 1; min-width: 200px; }
.job-list { display: flex; flex-direction: column; gap: 8px; }
.job-row { display: flex; align-items: center; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; box-shadow: var(--shadow); flex-wrap: wrap; cursor: pointer; }
.job-row:hover { border-color: var(--teal); }
.job-row .title-col { font-weight: 700; flex: 1; min-width: 160px; }
.job-row .client-col { color: var(--ink-soft); font-size: 0.85rem; min-width: 140px; }
.job-row .date-col { color: var(--ink-soft); font-size: 0.8rem; white-space: nowrap; }
.badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; text-transform: capitalize; }
.badge.booked { background: var(--orange-soft); color: var(--orange); }
.badge.certificate { background: var(--good-soft); color: var(--good); }
.badge.enquiry { background: var(--mint); color: var(--ink-soft); }
.modal-backdrop { position: fixed; inset: 0; background: rgba(20,40,45,0.45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
.modal-card { background: var(--surface); border-radius: var(--radius); padding: 26px; width: 100%; max-width: 460px; box-shadow: var(--shadow-lg); max-height: 90vh; overflow-y: auto; }
.modal-card h2 { margin: 0 0 18px; font-size: 1.2rem; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
.hidden { display: none !important; }
.form-status { font-size: 0.85rem; margin: 0 0 12px; min-height: 1.1em; }
</style>
</head>
<body>

<div class="app-shell">
  <nav class="sidebar" id="sidebarNav"></nav>

  <div class="main-col">
    <div class="topbar">
      <div id="topbarBrand"></div>
    </div>

    <div class="page-content wide">
      <div class="page-header">
        <h1>Jobs</h1>
        <p>Every job on file, linked to its client, diary bookings, and certificates.</p>
      </div>

      <div class="job-toolbar">
        <input type="search" id="searchInput" placeholder="Search jobs by title or client...">
      </div>

      <div id="jobList"><div class="empty-note">Loading jobs...</div></div>
    </div>
  </div>
</div>

<nav class="tab-bar" id="tabBarNav"></nav>

<div class="modal-backdrop hidden" id="jobModal">
  <div class="modal-card">
    <h2 id="modalTitle">Edit job</h2>
    <p class="form-status" id="formStatus"></p>
    <form id="jobForm">
      <input type="hidden" id="jobId">
      <div class="field">
        <label for="title">Job title *</label>
        <input type="text" id="title" required>
      </div>
      <div class="field">
        <label for="clientSelect">Client</label>
        <select id="clientSelect">
          <option value="">-- No client linked --</option>
        </select>
      </div>
      <div class="field">
        <label for="statusSelect">Status</label>
        <select id="statusSelect">
          <option value="enquiry">Enquiry</option>
          <option value="booked">Booked</option>
          <option value="certificate">Certificate</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <div class="field">
        <label for="address">Address</label>
        <input type="text" id="address">
      </div>
      <div class="field">
        <label for="notes">Notes</label>
        <textarea id="notes"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-danger" id="deleteJobBtn">Delete</button>
        <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">Save changes</button>
      </div>
    </form>
  </div>
</div>

<script src="shared.js"></script>
<script>
initAppShell("jobs");

let allJobs = [];
let allClients = [];
let businessId = null;

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtDate(d) {
  return new Date(d).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
}

function renderJobs(jobs) {
  const target = document.getElementById("jobList");
  if (!jobs.length) {
    target.innerHTML = `<div class="empty-note">No jobs yet -- jobs are created automatically when you book a diary entry or start a certificate.</div>`;
    return;
  }
  target.innerHTML = `<div class="job-list">${jobs.map(j => `
    <div class="job-row" data-job="${j.id}">
      <span class="title-col">${escapeHtml(j.title)}</span>
      <span class="client-col">${j.clients ? "👤 " + escapeHtml(j.clients.name) : "No client linked"}</span>
      <span class="badge ${escapeHtml(j.status)}">${escapeHtml(j.status)}</span>
      <span class="date-col">${fmtDate(j.created_at)}</span>
    </div>`).join("")}</div>`;

  target.querySelectorAll("[data-job]").forEach(row => row.addEventListener("click", () => openModal(row.dataset.job)));
}

async function loadClients() {
  const { data } = await supabaseClient.from("clients").select("id, name").eq("business_id", businessId).order("name");
  allClients = data || [];
  const select = document.getElementById("clientSelect");
  select.innerHTML = `<option value="">-- No client linked --</option>` +
    allClients.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("");
}

async function loadJobs() {
  const target = document.getElementById("jobList");
  const { data, error } = await supabaseClient
    .from("jobs")
    .select("*, clients(name)")
    .eq("business_id", businessId)
    .order("created_at", { ascending: false });
  if (error) {
    target.innerHTML = `<div class="empty-note">Couldn't load jobs: ${escapeHtml(error.message)}</div>`;
    return;
  }
  allJobs = data || [];
  renderJobs(allJobs);
}

function openModal(jobId) {
  const job = allJobs.find(j => j.id === jobId);
  if (!job) return;
  document.getElementById("jobForm").reset();
  document.getElementById("formStatus").textContent = "";
  document.getElementById("jobId").value = job.id;
  document.getElementById("title").value = job.title || "";
  document.getElementById("clientSelect").value = job.client_id || "";
  document.getElementById("statusSelect").value = job.status || "enquiry";
  document.getElementById("address").value = job.address || "";
  document.getElementById("notes").value = job.notes || "";
  document.getElementById("jobModal").classList.remove("hidden");
}
function closeModal() { document.getElementById("jobModal").classList.add("hidden"); }
document.getElementById("cancelBtn").addEventListener("click", closeModal);

document.getElementById("jobForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const status = document.getElementById("formStatus");
  const saveBtn = document.getElementById("saveBtn");
  const id = document.getElementById("jobId").value;
  const record = {
    title: document.getElementById("title").value.trim(),
    client_id: document.getElementById("clientSelect").value || null,
    status: document.getElementById("statusSelect").value,
    address: document.getElementById("address").value.trim() || null,
    notes: document.getElementById("notes").value.trim() || null,
  };
  saveBtn.disabled = true; saveBtn.textContent = "Saving...";
  status.style.color = "var(--ink-soft)"; status.textContent = "";
  try {
    const { error } = await supabaseClient.from("jobs").update(record).eq("id", id);
    if (error) throw error;
    closeModal();
    await loadJobs();
  } catch (err) {
    status.style.color = "var(--danger)";
    status.textContent = "Couldn't save: " + err.message;
  } finally {
    saveBtn.disabled = false; saveBtn.textContent = "Save changes";
  }
});

document.getElementById("deleteJobBtn").addEventListener("click", async () => {
  const id = document.getElementById("jobId").value;
  if (!id) return;
  if (!confirm("Delete this job? This can't be undone -- any linked diary entries or certificates will keep their own records, just lose the job link.")) return;
  const { error } = await supabaseClient.from("jobs").delete().eq("id", id);
  if (error) { alert("Couldn't delete: " + error.message); return; }
  closeModal();
  await loadJobs();
});

document.getElementById("searchInput").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { renderJobs(allJobs); return; }
  renderJobs(allJobs.filter(j =>
    (j.title || "").toLowerCase().includes(q) || (j.clients && j.clients.name.toLowerCase().includes(q))
  ));
});

(async function init() {
  businessId = await getCurrentBusinessId();
  if (!businessId) {
    document.getElementById("jobList").innerHTML = `<div class="empty-note">Couldn't load your business account -- try signing in again.</div>`;
    return;
  }
  await loadClients();
  await loadJobs();
})();
</script>
</body>
</html>
