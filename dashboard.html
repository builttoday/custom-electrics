<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — CRM</title>
<meta name="theme-color" content="#1E4E54">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='47' fill='%231E4E54' stroke='%23E2915C' stroke-width='6'/%3E%3Cpath d='M56 18 26 56h24l-4 26 30-38H52l4-26Z' fill='%23EAF3F1'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<div class="app-shell">
  <nav class="sidebar" id="sidebarNav"></nav>

  <div class="main-col">
    <div class="topbar">
      <div id="topbarBrand"></div>
    </div>

    <div class="page-content">
      <div class="page-header">
        <h1>Dashboard</h1>
        <p>A quick look at where the business stands right now.</p>
      </div>

      <div class="stat-grid">
        <a class="stat-card" href="jobs.html"><div class="stat-label">Active jobs</div><div class="stat-value" id="statJobs">--</div></a>
        <a class="stat-card" href="diary.html"><div class="stat-label">This week's diary</div><div class="stat-value" id="statDiary">--</div></a>
        <a class="stat-card" href="clients.html"><div class="stat-label">Total clients</div><div class="stat-value" id="statClients">--</div></a>
        <a class="stat-card" href="certificates.html"><div class="stat-label">Certificates issued</div><div class="stat-value" id="statCerts">--</div></a>
      </div>

      <div class="card" id="upcomingCard">
        <h3 style="margin-top:0;">This week's diary</h3>
        <div id="upcomingList"><p style="color:var(--ink-soft);">Loading...</p></div>
      </div>
    </div>
  </div>
</div>

<nav class="tab-bar" id="tabBarNav"></nav>

<script src="shared.js"></script>
<script>
initAppShell("dashboard");

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtTime(d) {
  return d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
}
function fmtDay(d) {
  return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
}
// Same Monday-start week convention as diary.html's startOfWeek(), duplicated here since
// this is a plain multi-page app with no shared module system for page-specific helpers.
function startOfWeek(d) {
  const date = new Date(d);
  const day = (date.getDay() + 6) % 7; // Monday = 0
  date.setDate(date.getDate() - day);
  date.setHours(0, 0, 0, 0);
  return date;
}

async function loadDashboard() {
  const businessId = await getCurrentBusinessId();
  if (!businessId) {
    document.getElementById("upcomingList").innerHTML =
      `<p style="color:var(--danger);">Couldn't load your business account -- try signing in again.</p>`;
    return;
  }

  const weekStart = startOfWeek(new Date());
  const weekEnd = new Date(weekStart);
  weekEnd.setDate(weekEnd.getDate() + 7);

  const [jobsRes, clientsRes, certsRes, diaryRes] = await Promise.all([
    supabaseClient.from("jobs").select("id", { count: "exact", head: true })
      .eq("business_id", businessId).not("status", "in", "(completed,cancelled)"),
    supabaseClient.from("clients").select("id", { count: "exact", head: true }).eq("business_id", businessId),
    supabaseClient.from("certificates").select("id", { count: "exact", head: true }).eq("business_id", businessId),
    supabaseClient.from("diary_events").select("id, title, start_time, location")
      .eq("business_id", businessId)
      .gte("start_time", weekStart.toISOString())
      .lt("start_time", weekEnd.toISOString())
      .order("start_time"),
  ]);

  document.getElementById("statJobs").textContent = jobsRes.count ?? "--";
  document.getElementById("statClients").textContent = clientsRes.count ?? "--";
  document.getElementById("statCerts").textContent = certsRes.count ?? "--";

  const events = diaryRes.data || [];
  document.getElementById("statDiary").textContent = events.length;

  const listTarget = document.getElementById("upcomingList");
  if (diaryRes.error) {
    listTarget.innerHTML = `<p style="color:var(--danger);">Couldn't load the diary: ${escapeHtml(diaryRes.error.message)}</p>`;
  } else if (!events.length) {
    listTarget.innerHTML = `<p style="color:var(--ink-soft);">Nothing booked this week.</p>`;
  } else {
    listTarget.innerHTML = events.map(ev => `
      <a href="diary.html?event=${ev.id}" style="display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;">
        <span>${escapeHtml(ev.title)}${ev.location ? " — " + escapeHtml(ev.location) : ""}</span>
        <span style="color:var(--ink-soft);white-space:nowrap;">${fmtDay(new Date(ev.start_time))}, ${fmtTime(new Date(ev.start_time))}</span>
      </a>`).join("");
    listTarget.style.display = "flex";
    listTarget.style.flexDirection = "column";
  }
}

loadDashboard();
</script>
</body>
</html>
